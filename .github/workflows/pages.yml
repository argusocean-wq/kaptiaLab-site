name: Deploy Kaptia Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "tests/test_pages_frontend.py"
      - "scripts/test_published_site.py"
      - "scripts/check_published_site.py"
      - ".nojekyll"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "tests/test_pages_frontend.py"
      - ".nojekyll"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # PR validation must not cancel a real production deployment from main.
  group: pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate landing page and JavaScript failure boundaries
        run: python -m unittest tests.test_pages_frontend scripts.test_published_site

  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: https://argusocean-wq.github.io/kaptiaLab-site/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage public website and latest Setup from the private core
        env:
          DISTRIBUTION_URL: ${{ vars.KAPTIA_DISTRIBUTION_URL }}
        run: |
          set -euo pipefail
          test -n "${DISTRIBUTION_URL:-}" || { echo "Set the KAPTIA_DISTRIBUTION_URL Actions variable to the deployed Cloudflare Worker origin."; exit 1; }
          case "$DISTRIBUTION_URL" in https://*) ;; *) echo "Worker URL must use HTTPS."; exit 1 ;; esac
          mkdir -p _site/downloads
          cp index.html manifest.webmanifest sw.js .nojekyll _site/
          curl --fail --silent --show-error --location --retry 3 "$DISTRIBUTION_URL/v1/manifest" -o /tmp/kaptia-manifest.json
          expected_sha="$(jq -r '.setup.sha256 // empty' /tmp/kaptia-manifest.json)"
          setup_url="$(jq -r '.setup.url // empty' /tmp/kaptia-manifest.json)"
          test "${#expected_sha}" -eq 64
          case "$expected_sha" in *[!0-9a-fA-F]*) echo "Invalid Setup SHA-256 in Worker manifest."; exit 1 ;; esac
          test "$setup_url" = "$DISTRIBUTION_URL/v1/assets/setup"
          curl --fail --silent --show-error --location --retry 3 "$setup_url" -o _site/downloads/Kaptia-Setup.exe
          actual_sha="$(sha256sum _site/downloads/Kaptia-Setup.exe | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"
          test "$(wc -c < _site/downloads/Kaptia-Setup.exe)" -gt 1024
          head -c 2 _site/downloads/Kaptia-Setup.exe | grep -q 'MZ'
          echo "Verified latest core Setup SHA-256: $actual_sha"
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the published site and critical assets
        env:
          PAGE_URL: https://argusocean-wq.github.io/kaptiaLab-site/
        run: python scripts/check_published_site.py "$PAGE_URL"
