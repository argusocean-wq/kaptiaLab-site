name: Deploy Kaptia Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "tests/test_pages_frontend.py"
      - "scripts/test_published_site.py"
      - "scripts/check_published_site.py"
      - ".nojekyll"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "tests/test_pages_frontend.py"
      - ".nojekyll"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # PR validation must not cancel a real production deployment from main.
  group: pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate landing page and JavaScript failure boundaries
        run: python -m unittest tests.test_pages_frontend scripts.test_published_site

  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: https://argusocean-wq.github.io/kaptiaLab-site/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage public website and current installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _site/downloads
          cp index.html manifest.webmanifest sw.js .nojekyll _site/

          # Publish version information as same-origin JSON; never expose GitHub release URLs to visitors.
          all_releases="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=10")"
          published="$(jq '[.[] | select(.draft == false and .published_at != null) | {name: (.name // .tag_name), tag_name, published_at, body: (.body // "")}]' <<< "$all_releases")"
          latest_tag="$(jq -r '.[0].tag_name // empty' <<< "$published")"
          test -n "$latest_tag"

          gh release download "$latest_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "Kaptia-Setup.exe" \
            --dir _site/downloads
          test -s _site/downloads/Kaptia-Setup.exe
          installer_sha256="$(sha256sum _site/downloads/Kaptia-Setup.exe | awk '{print $1}')"
          installer_size_bytes="$(wc -c < _site/downloads/Kaptia-Setup.exe | tr -d '[:space:]')"
          test "${#installer_sha256}" -eq 64
          test "$installer_size_bytes" -gt 1024

          jq -n \
            --argjson releases "$published" \
            --arg latest_tag "$latest_tag" \
            --arg installer_sha256 "$installer_sha256" \
            --argjson installer_size_bytes "$installer_size_bytes" \
            '{releases: $releases, downloadReady: true, installer: {file_name: "Kaptia-Setup.exe", tag_name: $latest_tag, sha256: $installer_sha256, size_bytes: $installer_size_bytes}}' > _site/releases.json
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the published site and critical assets
        env:
          PAGE_URL: https://argusocean-wq.github.io/kaptiaLab-site/
        run: python scripts/check_published_site.py "$PAGE_URL"
