name: Deploy Kaptia Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "tests/test_pages_frontend.py"
      - "scripts/test_published_site.py"
      - "scripts/check_published_site.py"
      - ".nojekyll"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "tests/test_pages_frontend.py"
      - "scripts/test_published_site.py"
      - "scripts/check_published_site.py"
      - ".nojekyll"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate landing page, service worker, and download contract
        run: python -m unittest tests.test_pages_frontend scripts.test_published_site -v

  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'kaptia-build-'))
    environment:
      name: github-pages
      url: https://argusocean-wq.github.io/kaptiaLab-site/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage website and latest public Setup release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _site/downloads
          cp index.html manifest.webmanifest sw.js .nojekyll _site/

          # The core CI publishes the verified EXE and checksum to this public repository.
          # No private-core credential or third-party distribution gateway is used here.
          gh release download --repo "$GITHUB_REPOSITORY" \
            --pattern "Kaptia-Setup.exe" \
            --pattern "Kaptia-Setup.exe.sha256" \
            --dir _site/downloads

          test -s _site/downloads/Kaptia-Setup.exe
          test -s _site/downloads/Kaptia-Setup.exe.sha256
          (
            cd _site/downloads
            sha256sum --check Kaptia-Setup.exe.sha256
          )
          installer_size="$(wc -c < _site/downloads/Kaptia-Setup.exe | tr -d '[:space:]')"
          test "$installer_size" -gt 1048576
          head -c 2 _site/downloads/Kaptia-Setup.exe | grep -q 'MZ'
          echo "Staged latest verified Setup: $installer_size bytes"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the published site and downloadable Setup
        env:
          PAGE_URL: https://argusocean-wq.github.io/kaptiaLab-site/
        run: python scripts/check_published_site.py "$PAGE_URL"
