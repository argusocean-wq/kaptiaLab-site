name: Validate KaptiaLab application

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/validate-kaptia-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated test dependencies
        run: python -m pip install --upgrade pytest fastapi pydantic httpx
      - name: Compile all application Python files
        run: python -m compileall -q app
      - name: Test M1 Core Foundation
        env:
          PYTHONPATH: app:app/scripts
        run: python -m pytest -q app/tests/test_core_foundation.py app/tests/test_research.py app/tests/test_research_runtime.py app/tests/test_chat_research_intent.py app/tests/test_chat_commands.py
      - name: Test Cloud Compute worker API
        env:
          PYTHONPATH: app
        run: python -m pytest -q app/cloud_worker/test_app.py
