name: Build and validate Kaptia Windows installer

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-windows-installer.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kaptia-windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements-cloud-worker.txt

      - name: Install installer build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pywebview pythonnet fastapi pydantic httpx pytest

      - name: Compile application and run portable API tests
        env:
          PYTHONPATH: app
        run: |
          python -m compileall -q app
          python -m pytest -q app/cloud_worker/test_app.py app/tests/test_installer_imports.py

      - name: Create root-relative, commit-pinned application archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path app/dist | Out-Null
          $commit = (git rev-parse HEAD).Trim()
          @"
          BUILD_NUMBER = $env:GITHUB_RUN_NUMBER
          BUILD_TAG = "kaptia-build-$env:GITHUB_RUN_NUMBER"
          SOURCE_COMMIT = "$commit"
          "@ | Set-Content -Path app/installer/build_info.py -Encoding utf8
          @'
          import os
          import zipfile
          from pathlib import Path

          root = Path("app")
          output = root / "dist" / "kaptia-core-source.zip"
          commit = (os.environ.get("GITHUB_SHA") or "").strip()
          if len(commit) != 40 or any(ch not in "0123456789abcdef" for ch in commit.lower()):
              raise SystemExit("GITHUB_SHA is not a valid 40-character commit")
          archive_root = Path(f"kaptiaLab-core-{commit}")
          excluded = {".git", "__pycache__", ".pytest_cache", ".mypy_cache", "dist"}
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(root.rglob("*")):
                  relative = path.relative_to(root)
                  if not path.is_file() or any(part in excluded for part in relative.parts):
                      continue
                  archive.write(path, (archive_root / relative).as_posix())
          with zipfile.ZipFile(output) as archive:
              names = set(archive.namelist())
              required = {
                  f"{archive_root.as_posix()}/README.md",
                  f"{archive_root.as_posix()}/scripts/chat.py",
                  f"{archive_root.as_posix()}/requirements.txt",
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f"Core archive is missing installer-required files: {missing}")
              if archive.testzip() is not None:
                  raise SystemExit("Core archive failed CRC verification")
          if not output.is_file() or output.stat().st_size < 1024:
              raise SystemExit("Core archive is missing or unexpectedly small")
          print(f"Created {output} ({output.stat().st_size} bytes) with root {archive_root}")
          '@ | Set-Content -Path app/dist/create_archive.py -Encoding utf8
          python app/dist/create_archive.py
          $hash = (Get-FileHash "app/dist/kaptia-core-source.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content -Path app/installer/build_info.py -Value "SOURCE_SHA256 = `"$hash`""
          Write-Output "Source commit: $commit"
          Write-Output "Core SHA-256: $hash"

      - name: Build self-contained Setup executable
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name Kaptia-Setup
          --paths app
          --collect-all webview
          --collect-all clr
          --collect-submodules installer
          --collect-submodules scripts
          --hidden-import webview.platforms.edgechromium
          --hidden-import installer.webview_installer
          --hidden-import installer.hardware_profile
          --hidden-import scripts.kaptia_locale
          --add-data "app/dist/kaptia-core-source.zip;payload"
          --add-data "app/ui;ui"
          app/installer/windows_installer.py

      - name: Verify executable, embedded payload, and checksum
        shell: pwsh
        run: |
          $exe = Get-Item "dist/Kaptia-Setup.exe" -ErrorAction Stop
          if ($exe.Length -le 1048576) { throw "Setup is unexpectedly small." }
          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Output is not a Windows PE executable." }
          $listing = (pyi-archive_viewer -l -r "dist/Kaptia-Setup.exe" 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect PyInstaller archive." }
          if ($listing -notmatch "kaptia-core-source.zip") { throw "Embedded application archive is missing." }
          if ($listing -notmatch "build_info") { throw "Build metadata is missing." }
          $hash = (Get-FileHash "dist/Kaptia-Setup.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Kaptia-Setup.exe" | Set-Content "dist/Kaptia-Setup.exe.sha256" -Encoding ascii
          Write-Output "EXE bytes: $($exe.Length)"
          Write-Output "SHA-256: $hash"
          $smoke = Start-Process -FilePath $exe.FullName -ArgumentList "--self-test-imports" -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "Frozen installer import smoke test failed (exit code $($smoke.ExitCode))." }
          Write-Output "Frozen installer import smoke test: PASS"

      - name: Upload pull request build artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Kaptia-Setup-validation-${{ github.sha }}
          path: |
            dist/Kaptia-Setup.exe
            dist/Kaptia-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish release on main only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kaptia-build-${{ github.run_number }}
          name: Kaptia Windows Installer ${{ github.run_number }}
          body: |
            Windows installer built from public KaptiaLab source.
            Source commit: ${{ github.sha }}.
            The application source archive is embedded in Setup and verified by SHA-256 before extraction.
          files: |
            dist/Kaptia-Setup.exe
            dist/Kaptia-Setup.exe.sha256
          make_latest: true
