name: Build and publish Kaptia Windows installer

on:
  push:
    branches: ["main"]
    paths:
      - "installer/**"
      - "ui/**"
      - "scripts/**"
      - "kaptia_packaging/**"
      - "tests/test_installer_download.py"
      - "tests/test_kaptia_update.py"
      - "tests/test_packaging_protocol.py"
      - "docs/UPTP.md"
      - "vscode-extension/**"
      - "requirements.txt"
      - ".github/workflows/build-windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaptia-windows-installer
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact core source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate source and regression tests
        shell: pwsh
        run: |
          python -m py_compile installer/windows_installer.py installer/webview_installer.py scripts/chat.py scripts/kaptia_foundry.py scripts/kaptia_webview.py scripts/kaptia_update.py scripts/kaptia_context_menu.py scripts/kaptia_packager.py kaptia_packaging/__init__.py kaptia_packaging/adapters.py kaptia_packaging/protocol.py
          python -m pip install pywebview pythonnet
          python -m unittest tests.test_installer_download tests.test_kaptia_context_menu tests.test_kaptia_update tests.test_packaging_protocol -v

      - name: Build pinned core archive and installer metadata
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $commit = (git rev-parse HEAD).Trim()
          $prefix = "kaptiaLab-core-$commit/"
          git archive --format=zip --prefix="$prefix" $commit -o dist/kaptia-core-source.zip
          if ($LASTEXITCODE -ne 0) { throw "Could not archive the checked-out source commit." }
          $coreHash = (Get-FileHash "dist/kaptia-core-source.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          @"
          BUILD_NUMBER = $env:GITHUB_RUN_NUMBER
          BUILD_TAG = "kaptia-build-$env:GITHUB_RUN_NUMBER"
          SOURCE_COMMIT = "$commit"
          SOURCE_SHA256 = "$coreHash"
          "@ | Set-Content -Path installer/build_info.py -Encoding utf8
          Write-Output "Pinned core commit: $commit"
          Write-Output "Pinned core archive SHA-256: $coreHash"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller pywebview pythonnet

      - name: Build self-contained Setup with embedded core
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Kaptia-Setup --collect-all webview --collect-all clr --hidden-import webview.platforms.edgechromium --add-data "dist/kaptia-core-source.zip;payload" --add-data "ui;ui" installer/windows_installer.py

      - name: Inspect PyInstaller archive for embedded core and build metadata
        shell: pwsh
        run: |
          $listing = (pyi-archive_viewer -l -r "dist/Kaptia-Setup.exe" 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect the generated Setup archive." }
          if ($listing -notmatch "kaptia-core-source.zip") { throw "The core ZIP is missing from the Setup executable." }
          if ($listing -notmatch "build_info") { throw "Build metadata is missing from the Setup executable." }
          Write-Output "Embedded core ZIP and build metadata are present."
      - name: Generate checksum and release manifest
        shell: pwsh
        run: |
          $exe = Get-Item "dist/Kaptia-Setup.exe" -ErrorAction Stop
          if ($exe.Length -le 1048576) { throw "Setup executable is unexpectedly small; embedded core may be missing." }
          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Setup is not a Windows PE executable." }
          $setupHash = (Get-FileHash "dist/Kaptia-Setup.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$setupHash  Kaptia-Setup.exe" | Set-Content dist/Kaptia-Setup.exe.sha256 -Encoding ascii
          $coreHash = (Get-FileHash "dist/kaptia-core-source.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $commit = (git rev-parse HEAD).Trim()
          $tag = "kaptia-build-$env:GITHUB_RUN_NUMBER"
          @(
            @{
              schema = 1
              build_number = [int]$env:GITHUB_RUN_NUMBER
              tag = $tag
              source_commit = $commit
              core_sha256 = $coreHash
              setup_sha256 = $setupHash
              setup_size_bytes = $exe.Length
            } | ConvertTo-Json -Depth 4
          ) | Set-Content dist/kaptia-manifest.json -Encoding utf8
          $manifest = Get-Content dist/kaptia-manifest.json -Raw | ConvertFrom-Json
          if ($manifest.source_commit -ne $commit -or $manifest.setup_sha256 -ne $setupHash) { throw "Release manifest verification failed." }
          Write-Output "Setup bytes: $($exe.Length)"
          Write-Output "Setup SHA-256: $setupHash"

      - name: Require least-privilege public site publishing credential
        shell: pwsh
        env:
          SITE_RELEASE_TOKEN: ${{ secrets.KAPTIALAB_SITE_RELEASE_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SITE_RELEASE_TOKEN)) {
            throw "Missing KAPTIALAB_SITE_RELEASE_TOKEN. Configure a fine-grained token with Contents: Read and write on argusocean-wq/kaptiaLab-site only."
          }

      - name: Publish verified latest Setup to public site repository
        uses: softprops/action-gh-release@v2
        with:
          repository: argusocean-wq/kaptiaLab-site
          token: ${{ secrets.KAPTIALAB_SITE_RELEASE_TOKEN }}
          tag_name: kaptia-build-${{ github.run_number }}
          name: Kaptia Windows Installer ${{ github.run_number }}
          body: |
            Verified Windows installer for kaptiaLab.
            Core source commit: ${{ github.sha }}.
            The core archive is embedded in Setup and SHA-256 checked before extraction.
            This release contains only the public installer and its checksum.
          target_commitish: main
          files: |
            dist/Kaptia-Setup.exe
            dist/Kaptia-Setup.exe.sha256
          overwrite_files: true
          make_latest: true
