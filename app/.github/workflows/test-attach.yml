name: Validate Desktop Attach

on:
  pull_request:
    branches: ["main", "feature/desktop-attach"]
    paths:
      - "scripts/kaptia_attach.py"
      - "scripts/kaptia_tools.py"
      - "scripts/kaptia_agent_loop.py"
      - "scripts/kaptia_webview.py"
      - "scripts/kaptia_cli.py"
      - "scripts/test_kaptia_cli.py"
      - "docs/CLI.md"
      - "scripts/kaptia_cloud_compute.py"
      - "scripts/test_kaptia_cloud_compute.py"
      - "cloud_worker/**"
      - "requirements-cloud-worker.txt"
      - "docs/CLOUD_COMPUTE.md"
      - "README.md"
      - "scripts/test_kaptia_agent_loop.py"
      - "tests/test_kaptia_attach.py"
      - "ui/web/index.html"
      - "requirements-attach.txt"
      - "requirements-attach-vision.txt"
      - "requirements.txt"
      - "docs/ATTACH.md"
      - ".github/workflows/test-attach.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attach-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Attach modules
        run: python -m py_compile scripts/kaptia_attach.py scripts/kaptia_tools.py scripts/kaptia_agent_loop.py scripts/kaptia_webview.py
      - name: Run Attach security tests
        run: python -m unittest tests.test_kaptia_attach -v
      - name: Compile CLI and run CLI regression tests
        run: |
          python -m py_compile scripts/kaptia_cli.py
          python -m unittest scripts.test_kaptia_cli -v
      - name: Install Cloud Worker test dependencies
        run: python -m pip install -r requirements-cloud-worker.txt
      - name: Compile Cloud Compute modules and run regression tests
        run: |
          python -m py_compile scripts/kaptia_cloud_compute.py scripts/kaptia_cli.py scripts/kaptia_webview.py cloud_worker/app.py
          python -m unittest scripts.test_kaptia_cloud_compute -v
          python -m unittest cloud_worker.test_app -v
      - name: Run agent tool-loop tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "scripts"
          python -m unittest test_kaptia_agent_loop -v
